<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f1">

<title>My Carb, Protein & Fasting Tracker</title>

<link rel="manifest" href="manifest.json">

<style>
:root {
  --bg: #f7f6f1;
  --card: #ffffff;
  --text: #242424;
  --muted: #6c6c6c;
  --line: #e5e1d8;
  --accent: #326b5c;
  --soft: #eef3f0;
  --danger: #9b3d3d;
}
 

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
 * {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

main {
  max-width: 760px;
  margin: auto;
  padding: 16px 16px 70px;
}

h1 {
  font-size: 1.55rem;
  margin: 5px 0;
}

.sub {
  color: var(--muted);
  margin-bottom: 14px;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px;
  margin: 12px 0;
  box-shadow: 0 2px 8px rgba(0,0,0,.03);
}

h2 {
  font-size: 1.18rem;
  margin: 0 0 10px;
}

.grid2,
.summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.metric {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px;
}

.metric span {
  font-size: .9rem;
  color: var(--muted);
}

.metric b {
  display: block;
  font-size: 1.35rem;
  margin-top: 3px;
}

label {
  display: block;
  font-weight: 650;
  margin: 10px 0 5px;
}

input,
button {
  width: 100%;
  padding: 12px;
  font-size: 1rem;
  border: 1px solid #cbc5ba;
  border-radius: 12px;
  background: #fff;
}

button {
  background: var(--accent);
  color: #fff;
  border: 0;
  font-weight: 750;
  margin-top: 12px;
  cursor: pointer;
}

.secondary {
  background: #ece9e1;
  color: var(--text);
}

.danger {
  background: var(--danger);
}

.row {
  display: flex;
  gap: 8px;
}

.row > * {
  flex: 1;
}

.food-item {
  border-top: 1px solid var(--line);
  padding: 11px 0;
}

.food-item:first-child {
  border-top: 0;
}

.food-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.food-name {
  font-weight: 750;
}

.food-time {
  color: var(--muted);
  font-size: .9rem;
}

.food-numbers {
  color: var(--muted);
  margin-top: 4px;
  font-size: .93rem;
}

.small {
  font-size: .88rem;
  color: var(--muted);
}

.hidden {
  display: none;
}

hr {
  border: 0;
  border-top: 1px solid var(--line);
  margin: 14px 0;
}

@media (max-width: 520px) {
  .grid2,
  .summary {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>
<main>

<h1>My Carb, Protein & Fasting Tracker</h1>
<div class="sub">Simple daily tracking — carbs, fiber, net carbs, protein & fasting.</div>

<div class="card">
  <h2>Today's Summary</h2>

  <div class="summary">
    <div class="metric">
      <span>Total Carbs</span>
      <b id="totalCarbs">0 g</b>
    </div>

    <div class="metric">
      <span>Fiber</span>
      <b id="totalFiber">0 g</b>
    </div>

    <div class="metric">
      <span>Net Carbs</span>
      <b id="totalNet">0 g</b>
    </div>

    <div class="metric">
      <span>Protein</span>
      <b id="totalProtein">0 g</b>
    </div>
  </div>
</div>
<div class="card">
  <h2>Add Food</h2>

  <label for="foodName">Food</label>
  <input id="foodName" type="text" placeholder="Example: eggs, chicken, yogurt">

  <div class="grid2">
    <div>
      <label for="carbs">Total Carbs (g)</label>
      <input id="carbs" type="number" min="0" step="0.1" inputmode="decimal">
    </div>

    <div>
      <label for="fiber">Fiber (g)</label>
      <input id="fiber" type="number" min="0" step="0.1" inputmode="decimal">
    </div>

    <div>
      <label for="protein">Protein (g)</label>
      <input id="protein" type="number" min="0" step="0.1" inputmode="decimal">
    </div>

    <div>
      <label for="foodTime">Time</label>
      <input id="foodTime" type="time">
    </div>
  </div>

  <button id="addFoodBtn" type="button">Add Food</button>
</div>

<div class="card">
  <h2>Today's Foods</h2>
  <div id="foodList">
    <div class="small" id="emptyFoodMessage">No foods entered yet.</div>
  </div>
</div>

<div class="card">
  <h2>Fasting Tracker</h2>

  <div class="grid2">
    <div>
      <label for="fastStart">Fast Started</label>
      <input id="fastStart" type="time">
    </div>

    <div>
      <label for="fastEnd">Fast Ended</label>
      <input id="fastEnd" type="time">
    </div>
  </div>

  <button id="saveFastBtn" type="button">Save Fasting Times</button>

  <div id="fastResult" class="small" style="margin-top:10px;">
    No fasting times saved yet.
  </div>
</div>
<div class="card">
  <h2>Daily Controls</h2>

  <button id="clearTodayBtn" class="danger" type="button">
    Clear Today's Foods
  </button>
</div>

</main>

<script>
const STORAGE_KEY = "carbTrackerFoods";
const FAST_KEY = "carbTrackerFast";

let foods = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

function numberValue(id) {
  const value = parseFloat(document.getElementById(id).value);
  return Number.isFinite(value) ? value : 0;
}

function formatNumber(value) {
  return Number(value.toFixed(1));
}

function saveFoods() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(foods));
}

function renderFoods() {
  const foodList = document.getElementById("foodList");

  let totalCarbs = 0;
  let totalFiber = 0;
  let totalProtein = 0;

  foodList.innerHTML = "";

  if (foods.length === 0) {
    foodList.innerHTML =
      '<div class="small" id="emptyFoodMessage">No foods entered yet.</div>';
  }

  foods.forEach((food, index) => {
    totalCarbs += food.carbs;
    totalFiber += food.fiber;
    totalProtein += food.protein;

    const netCarbs = Math.max(0, food.carbs - food.fiber);

    const item = document.createElement("div");
    item.className = "food-item";

    item.innerHTML = `
      <div class="food-top">
        <div class="food-name">${food.name}</div>
        <div class="food-time">${food.time || ""}</div>
      </div>

      <div class="food-numbers">
        Carbs: ${formatNumber(food.carbs)} g ·
        Fiber: ${formatNumber(food.fiber)} g ·
        Net: ${formatNumber(netCarbs)} g ·
        Protein: ${formatNumber(food.protein)} g
      </div>

      <button
        class="secondary"
        type="button"
        onclick="deleteFood(${index})">
        Delete
      </button>
    `;

    foodList.appendChild(item);
  });

  const totalNet = Math.max(0, totalCarbs - totalFiber);

  document.getElementById("totalCarbs").textContent =
    formatNumber(totalCarbs) + " g";

  document.getElementById("totalFiber").textContent =
    formatNumber(totalFiber) + " g";

  document.getElementById("totalNet").textContent =
    formatNumber(totalNet) + " g";

  document.getElementById("totalProtein").textContent =
    formatNumber(totalProtein) + " g";
}
 function addFood() {
  const name = document.getElementById("foodName").value.trim();
  const carbs = numberValue("carbs");
  const fiber = numberValue("fiber");
  const protein = numberValue("protein");
  const time = document.getElementById("foodTime").value;

  if (!name) {
    alert("Please enter a food name.");
    return;
  }

  foods.push({
    name: name,
    carbs: carbs,
    fiber: fiber,
    protein: protein,
    time: time
  });

  saveFoods();
  renderFoods();

  document.getElementById("foodName").value = "";
  document.getElementById("carbs").value = "";
  document.getElementById("fiber").value = "";
  document.getElementById("protein").value = "";
  document.getElementById("foodTime").value = "";
}

function deleteFood(index) {
  foods.splice(index, 1);
  saveFoods();
  renderFoods();
}

function clearToday() {
  if (!confirm("Clear all of today's foods?")) {
    return;
  }

  foods = [];
  saveFoods();
  renderFoods();
}

function saveFast() {
  const start = document.getElementById("fastStart").value;
  const end = document.getElementById("fastEnd").value;

  const fasting = {
    start: start,
    end: end
  };

  localStorage.setItem(FAST_KEY, JSON.stringify(fasting));
  showFast();
}

function showFast() {
  const saved = JSON.parse(localStorage.getItem(FAST_KEY) || "null");
  const result = document.getElementById("fastResult");

  if (!saved || (!saved.start && !saved.end)) {
    result.textContent = "No fasting times saved yet.";
    return;
  }

  document.getElementById("fastStart").value = saved.start || "";
  document.getElementById("fastEnd").value = saved.end || "";

  if (saved.start && saved.end) {
    const startParts = saved.start.split(":");
    const endParts = saved.end.split(":");

    let startMinutes =
      Number(startParts[0]) * 60 + Number(startParts[1]);

    let endMinutes =
      Number(endParts[0]) * 60 + Number(endParts[1]);

    if (endMinutes < startMinutes) {
      endMinutes += 24 * 60;
    }

    const duration = endMinutes - startMinutes;
    const hours = Math.floor(duration / 60);
    const minutes = duration % 60;

    result.textContent =
      "Fast length: " + hours + " hr " + minutes + " min";
  } else {
    result.textContent = "Fasting times saved.";
  }
}
 document.getElementById("addFoodBtn").addEventListener("click", addFood);

document.getElementById("clearTodayBtn").addEventListener("click", clearToday);

document.getElementById("saveFastBtn").addEventListener("click", saveFast);

renderFoods();
showFast();

</script>
</body>
</html>
